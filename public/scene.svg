<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 -90 1600 510" preserveAspectRatio="xMidYMax slice">
  <!-- Original Miami beachfront at dusk: sun, art-deco hotels, palms, water. -->
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset=".55" stop-color="#ffd09a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffb3a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3b4ea"/>
      <stop offset="1" stop-color="#8a8fd6"/>
    </linearGradient>
    <linearGradient id="deco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde6d2"/>
      <stop offset="1" stop-color="#f1c9d9"/>
    </linearGradient>
    <linearGradient id="decoShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9c0e6"/>
      <stop offset="1" stop-color="#c3a9dd"/>
    </linearGradient>
    <pattern id="win" width="26" height="24" patternUnits="userSpaceOnUse">
      <rect x="7" y="7" width="12" height="10" rx="1" fill="#b9aee6"/>
    </pattern>
    <pattern id="winFar" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="6" height="6" fill="#c9d0f5" opacity=".7"/>
    </pattern>
    <path id="frond" d="M0 0C38-40 112-48 168 22C150 8 136 4 124 6L132 20C112 6 96 2 84 4L90 18C72 4 56-2 44 2L48 14C32 4 16 4 0 7Z"/>
    <g id="palm" fill="#6f3f88">
      <path d="M-5 0C-9 120-30 220-40 300H-22C-14 220 4 120 6 0Z"/>
      <g>
        <use href="#frond" xlink:href="#frond" transform="rotate(-38)"/>
        <use href="#frond" xlink:href="#frond" transform="rotate(-8)"/>
        <use href="#frond" xlink:href="#frond" transform="rotate(22) scale(.9)"/>
        <use href="#frond" xlink:href="#frond" transform="rotate(52) scale(.75)"/>
        <use href="#frond" xlink:href="#frond" transform="scale(-1 1) rotate(-34)"/>
        <use href="#frond" xlink:href="#frond" transform="scale(-1 1) rotate(-4) scale(.95)"/>
        <use href="#frond" xlink:href="#frond" transform="scale(-1 1) rotate(26) scale(.85)"/>
        <use href="#frond" xlink:href="#frond" transform="scale(-1 1) rotate(56) scale(.7)"/>
        <use href="#frond" xlink:href="#frond" transform="rotate(-80) scale(.6)"/>
      </g>
      <circle cx="0" cy="4" r="9"/>
    </g>
  </defs>

  <!-- Sun low on the horizon -->
  <circle cx="800" cy="330" r="190" fill="url(#sun)"/>
  <circle cx="800" cy="330" r="78" fill="#ffe7b0" opacity=".85"/>

  <!-- Distant skyline -->
  <g fill="#b7bdf0" opacity=".75">
    <rect x="0" y="230" width="60" height="130"/>
    <rect x="70" y="200" width="44" height="160"/>
    <rect x="430" y="250" width="70" height="110"/>
    <rect x="505" y="215" width="40" height="145"/>
    <rect x="690" y="265" width="46" height="95"/>
    <rect x="880" y="245" width="54" height="115"/>
    <rect x="1120" y="160" width="50" height="200"/>
    <rect x="1176" y="205" width="36" height="155"/>
    <rect x="1540" y="190" width="60" height="170"/>
  </g>
  <g fill="url(#winFar)">
    <rect x="70" y="200" width="44" height="160"/>
    <rect x="505" y="215" width="40" height="145"/>
    <rect x="1120" y="160" width="50" height="200"/>
  </g>

  <!-- Art-deco hotels, left -->
  <g>
    <rect x="120" y="205" width="230" height="155" fill="url(#deco)"/>
    <rect x="170" y="178" width="130" height="28" fill="url(#deco)"/>
    <rect x="215" y="150" width="40" height="30" fill="url(#deco)"/>
    <rect x="228" y="120" width="14" height="32" fill="#f4a9c8"/>
    <rect x="120" y="205" width="230" height="8" fill="#f4a9c8"/>
    <rect x="130" y="222" width="210" height="130" fill="url(#win)"/>
    <rect x="228" y="213" width="14" height="147" fill="#a9e3d5"/>
    <rect x="350" y="228" width="40" height="132" fill="url(#decoShade)"/>
  </g>
  <g>
    <rect x="380" y="262" width="180" height="98" fill="url(#deco)"/>
    <rect x="380" y="262" width="180" height="6" fill="#a9e3d5"/>
    <rect x="390" y="276" width="160" height="78" fill="url(#win)"/>
    <rect x="380" y="330" width="180" height="5" fill="#f4a9c8" opacity=".8"/>
  </g>
  <g>
    <rect x="590" y="300" width="130" height="60" fill="url(#deco)"/>
    <rect x="598" y="312" width="114" height="44" fill="url(#win)"/>
  </g>

  <!-- Art-deco hotels, right -->
  <g>
    <rect x="880" y="292" width="130" height="68" fill="url(#deco)"/>
    <rect x="888" y="304" width="114" height="50" fill="url(#win)"/>
  </g>
  <g>
    <path d="M1040 360V260a40 40 0 0 1 40-40h170v140Z" fill="url(#deco)"/>
    <rect x="1040" y="262" width="210" height="6" fill="#f4a9c8"/>
    <rect x="1040" y="302" width="210" height="6" fill="#f4a9c8"/>
    <rect x="1052" y="272" width="190" height="26" fill="url(#win)"/>
    <rect x="1052" y="312" width="190" height="44" fill="url(#win)"/>
    <rect x="1138" y="170" width="18" height="60" rx="4" fill="#fde6d2"/>
    <rect x="1143" y="178" width="8" height="44" rx="2" fill="#f58fc0"/>
  </g>
  <g>
    <rect x="1270" y="190" width="220" height="170" fill="url(#deco)"/>
    <rect x="1300" y="165" width="160" height="26" fill="url(#deco)"/>
    <rect x="1345" y="140" width="70" height="26" fill="url(#deco)"/>
    <rect x="1374" y="112" width="12" height="30" fill="#a9e3d5"/>
    <rect x="1270" y="190" width="220" height="8" fill="#a9e3d5"/>
    <rect x="1280" y="208" width="200" height="146" fill="url(#win)"/>
    <rect x="1374" y="198" width="12" height="162" fill="#f4a9c8"/>
    <rect x="1490" y="215" width="50" height="145" fill="url(#decoShade)"/>
  </g>

  <!-- Promenade -->
  <rect x="0" y="352" width="1600" height="10" fill="#e7b9d4"/>

  <!-- Birds -->
  <g fill="none" stroke="#6f3f88" stroke-width="2.4" stroke-linecap="round">
    <path d="M690 118q7-8 14 0q7-8 14 0"/>
    <path d="M730 96q6-7 12 0q6-7 12 0"/>
    <path d="M662 140q5-6 10 0q5-6 10 0"/>
  </g>

  <!-- Palms: base of trunk sits on the promenade (y=360) -->
  <use href="#palm" xlink:href="#palm" transform="translate(210 30) scale(1.1)"/>
  <use href="#palm" xlink:href="#palm" transform="translate(40 100) scale(-.87 .87)" opacity=".9"/>
  <use href="#palm" xlink:href="#palm" transform="translate(420 150) scale(-.7 .7)" opacity=".85"/>
  <use href="#palm" xlink:href="#palm" transform="translate(620 220) scale(.47 .47)" opacity=".8"/>
  <use href="#palm" xlink:href="#palm" transform="translate(1010 195) scale(-.55 .55)" opacity=".8"/>
  <use href="#palm" xlink:href="#palm" transform="translate(1250 120) scale(.8)" opacity=".9"/>
  <use href="#palm" xlink:href="#palm" transform="translate(1440 24) scale(-1.12 1.12)"/>

  <!-- Water with sun reflection -->
  <rect x="0" y="362" width="1600" height="58" fill="url(#water)"/>
  <g fill="#ffe2b8" opacity=".85">
    <rect x="740" y="368" width="120" height="3" rx="1.5"/>
    <rect x="760" y="378" width="80" height="3" rx="1.5"/>
    <rect x="776" y="388" width="48" height="3" rx="1.5"/>
  </g>
  <g fill="#dff5ec" opacity=".55">
    <path d="M90 376c30-6 60-6 90 0c-30 3-60 3-90 0Z"/>
    <path d="M420 386c40-7 80-7 120 0c-40 4-80 4-120 0Z"/>
    <path d="M1060 378c34-6 68-6 102 0c-34 3-68 3-102 0Z"/>
    <path d="M1380 390c40-7 80-7 120 0c-40 4-80 4-120 0Z"/>
  </g>
</svg>
